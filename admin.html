<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b3d52">
<title>Admin | Swarga by the Bay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=7">
</head>
<body class="adm">

<!-- ============ LOGIN ============ -->
<section id="loginView" class="welcome">
  <div class="sky"><div class="sun"></div><div class="bird b1"></div></div>
  <div class="login-wrap">
    <p class="eyebrow">Management</p>
    <h1 class="login-title">Swarga <span>by the Bay</span></h1>
    <form id="loginForm" class="login-card" autocomplete="on">
      <h2>Welcome back</h2>
      <p class="fine">Sign in to view guest check-ins.</p>
      <div class="field"><input id="username" name="username" autocomplete="username" required placeholder=" "><label for="username">Username</label></div>
      <div class="field pw"><input id="password" name="password" type="password" autocomplete="current-password" required placeholder=" "><label for="password">Password</label><button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password">Show</button></div>
      <button type="submit" class="btn btn-sun wide" id="loginBtn">Sign in</button>
    </form>
  </div>
  <svg class="waves" viewBox="0 0 1440 220" preserveAspectRatio="none" aria-hidden="true">
    <path class="w1" d="M0,120 C240,170 480,70 720,110 C960,150 1200,80 1440,120 L1440,220 L0,220 Z"/>
    <path class="w2" d="M0,150 C240,110 480,190 720,150 C960,110 1200,180 1440,140 L1440,220 L0,220 Z"/>
    <path class="w3" d="M0,180 C300,160 520,210 760,185 C1000,160 1240,205 1440,180 L1440,220 L0,220 Z"/>
  </svg>
</section>

<!-- ============ DASHBOARD ============ -->
<div id="listView" class="dash hidden">
  <header class="dash-hero">
    <div class="dash-top">
      <div class="brand-mini light">Swarga <em>by the Bay</em></div>
      <div class="dash-actions">
        <button type="button" class="chip-btn" id="refreshBtn" title="Refresh">↻ Refresh</button>
        <button type="button" class="chip-btn" id="logoutBtn">Sign out</button>
      </div>
    </div>
    <p class="eyebrow" id="greetDate"></p>
    <h1>Guest check-ins</h1>
    <div class="stats">
      <button type="button" class="stat" data-view="arrivals"><small>Arrivals due</small><strong id="stArr">0</strong></button>
      <button type="button" class="stat" data-view="inhouse"><small>In house</small><strong id="stHouse">0</strong></button>
      <button type="button" class="stat" data-view="departures"><small>Departures due</small><strong id="stDep">0</strong></button>
      <button type="button" class="stat warn" data-view="unverified"><small>Pending verification</small><strong id="stPending">0</strong></button>
    </div>
  </header>

  <main class="dash-body">
    <div class="toolbar2">
      <div class="search"><span>🔍</span><input id="search" type="search" placeholder="Name, mobile, reference, ID or vehicle no."></div>
      <button type="button" class="chip-btn dark" id="csvBtn">⬇ Export CSV</button>
    </div>
    <div class="tabs" id="viewTabs" role="tablist">
      <button type="button" data-view="arrivals">Arrivals</button>
      <button type="button" data-view="inhouse">In house</button>
      <button type="button" data-view="departures">Departures</button>
      <button type="button" data-view="checkedout">Checked out</button>
      <button type="button" data-view="unverified">Unverified</button>
      <button type="button" data-view="all" class="on">All</button>
    </div>
    <div class="range">
      <label>Stay dates from <input type="date" id="fromDate"></label>
      <label>to <input type="date" id="toDate"></label>
      <button type="button" class="link-btn" id="clearFilters">Clear</button>
    </div>
    <p id="count" class="fine"></p>
    <div id="rows" class="guest-list"></div>
    <div id="empty" class="empty hidden"><span>🏖️</span><p>No check-ins match.</p></div>
  </main>
</div>

<!-- ============ DETAIL ============ -->
<dialog id="detail" class="drawer">
  <div class="drawer-head">
    <div>
      <p class="eyebrow" id="dlgRef"></p>
      <h2 id="dlgTitle"></h2>
      <span id="dlgBadge"></span>
    </div>
    <button type="button" class="icon-btn" id="closeDlg" aria-label="Close">✕</button>
  </div>
  <div class="drawer-body">
    <div class="ticket" id="dlgStay"></div>
    <section class="dsec stay-sec">
      <h3>🏠 Stay</h3>
      <div id="stayBlock"></div>
    </section>
    <section class="dsec hidden" id="historySec">
      <h3>↺ Previous stays</h3>
      <div id="historyBlock"></div>
    </section>
    <section class="dsec">
      <div class="dsec-head"><h3>🚗 Vehicles</h3><button type="button" class="link-btn" id="vehEdit">Edit</button></div>
      <div id="vehBlock"></div>
    </section>
    <div id="dlgSections"></div>
    <section class="dsec">
      <h3>🪪 ID proof</h3>
      <div id="idProof"></div>
    </section>
    <section class="dsec">
      <h3>✍️ Property representative</h3>
      <div id="verifyBlock"></div>
    </section>
  </div>
</dialog>

<div id="msg" class="toast" role="alert"></div>

<script src="assets/config.js?v=7"></script>
<script src="assets/admin.js?v=7"></script>
</body>
</html>
